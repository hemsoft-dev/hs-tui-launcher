name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Check formatting and lint policy
        shell: pwsh
        run: ./scripts/Test-Lint.ps1

  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked Node.js dependencies
        run: npm ci --ignore-scripts

      - name: Type-check TypeScript and JavaScript integration sources
        run: npm run typecheck

      - name: Run guarded Node.js suites
        shell: pwsh
        run: ./scripts/Test-NodeTests.ps1

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install pinned security scanners
        shell: pwsh
        run: ./scripts/Install-SecurityTools.ps1

      - name: Security scans
        shell: pwsh
        env:
          SECURITY_PR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: ./scripts/Test-Security.ps1 -OutputDirectory security-artifacts

      - name: Prove controlled fixtures are rejected
        shell: pwsh
        run: ./scripts/Test-SecurityFixtures.ps1

      - name: Retain redacted secret-scan evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: secret-scanning-${{ github.event.pull_request.head.sha || github.sha }}
          path: security-artifacts/
          if-no-files-found: warn
          overwrite: true
          retention-days: 14

  coverage:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
          - os: macos-latest
            target: macos
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Test coverage and CRAP calculations
        shell: pwsh
        run: ./scripts/Test-CoverageCrap.Unit.ps1

      - name: Enforce coverage and CRAP gates
        shell: pwsh
        run: ./scripts/Test-CoverageCrap.ps1 -OutputDirectory coverage-crap-artifacts

      - name: Retain coverage and CRAP reports
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-crap-${{ matrix.target }}-${{ runner.arch }}-${{ github.sha }}
          path: coverage-crap-artifacts/
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  platform:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
          - os: macos-latest
            target: macos
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Set up Python
        if: ${{ runner.os != 'Windows' }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.x'

      - name: Confirm wrapper prerequisites
        shell: pwsh
        run: |
          pwsh --version
          if ($IsWindows) {
            Get-Command ./run.ps1 -ErrorAction Stop | Out-Null
          }
          else {
            python3 --version
            Get-Command ./run.sh -ErrorAction Stop | Out-Null
          }

      - name: Build launcher
        run: go build ./...

      - name: Vet launcher
        run: go vet ./...

      - name: Test launcher
        run: go test -count=1 ./...

      - name: Qualify native and go-run wrapper handoff
        shell: pwsh
        run: ./scripts/Test-LauncherHandoff.ps1 -OutputDirectory '${{ runner.temp }}/launcher-handoff-artifacts'

      - name: Prove handoff mismatches are rejected
        shell: pwsh
        run: ./scripts/Test-LauncherHandoff.ps1 -NegativeCheck -OutputDirectory '${{ runner.temp }}/launcher-handoff-artifacts'

      - name: Retain bounded handoff evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: launcher-handoff-${{ matrix.target }}-${{ runner.arch }}-${{ github.sha }}
          path: ${{ runner.temp }}/launcher-handoff-artifacts/
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  platform-gate:
    needs:
      - platform
    if: ${{ always() }}
    runs-on: ubuntu-latest

    steps:
      - name: Require every supported platform
        if: ${{ needs.platform.result != 'success' }}
        shell: pwsh
        run: throw "Supported-platform matrix result was '${{ needs.platform.result }}'."

  performance:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PERFORMANCE_PR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Verify benchmark parser and comparison policy
        shell: pwsh
        run: ./scripts/Test-PerformancePolicy.Unit.ps1
      - name: Qualify launcher latency and allocations
        shell: pwsh
        run: |
          ./scripts/Test-Performance.ps1 -OutputDirectory performance-artifacts/first
          ./scripts/Test-Performance.ps1 -OutputDirectory performance-artifacts/second
      - name: Reject real additional benchmark work
        shell: pwsh
        run: ./scripts/Test-PerformanceFixtures.ps1 -OutputDirectory performance-artifacts/controlled
      - name: Retain raw performance measurements
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: performance-${{ matrix.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: performance-artifacts/
          if-no-files-found: warn
          overwrite: true
          retention-days: 14

  performance-gate:
    needs: performance
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require all native performance targets
        if: ${{ needs.performance.result != 'success' }}
        shell: pwsh
        run: throw "Native performance matrix result was '${{ needs.performance.result }}'."

  pi-resources:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      RESOURCE_PR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Qualify repeated offline resource captures
        shell: pwsh
        run: |
          ./scripts/Test-PiResources.ps1 -OutputDirectory pi-resource-artifacts/first
          ./scripts/Test-PiResources.ps1 -OutputDirectory pi-resource-artifacts/second
      - name: Reject actual retained resources
        shell: pwsh
        run: ./scripts/Test-PiResources.ps1 -NegativeCheck -OutputDirectory pi-resource-artifacts/controlled
      - name: Retain bounded resource evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pi-resources-${{ matrix.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: pi-resource-artifacts/
          if-no-files-found: warn
          overwrite: true
          retention-days: 14

  pi-resources-gate:
    needs: pi-resources
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require all native resource targets
        if: ${{ needs.pi-resources.result != 'success' }}
        shell: pwsh
        run: throw "Native resource matrix result was '${{ needs.pi-resources.result }}'."

  verify:
    needs:
      - lint
      - typescript
      - security
      - coverage
      - platform-gate
      - performance-gate
      - pi-resources-gate
    if: ${{ always() }}
    runs-on: windows-latest

    steps:
      - name: Require prerequisite success
        if: ${{ needs.lint.result != 'success' || needs.typescript.result != 'success' || needs.security.result != 'success' || needs.coverage.result != 'success' || needs.platform-gate.result != 'success' || needs.performance-gate.result != 'success' || needs.pi-resources-gate.result != 'success' }}
        shell: pwsh
        run: |
          throw "Required job failure: lint=${{ needs.lint.result }}, typescript=${{ needs.typescript.result }}, security=${{ needs.security.result }}, coverage=${{ needs.coverage.result }}, platform-gate=${{ needs.platform-gate.result }}, performance-gate=${{ needs.performance-gate.result }}, pi-resources-gate=${{ needs.pi-resources-gate.result }}."

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install analysis tools
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
          go install golang.org/x/tools/cmd/deadcode@v0.49.0

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Complexity
        shell: pwsh
        run: ./scripts/Test-Complexity.ps1

      - name: Staticcheck
        run: staticcheck ./...

      - name: Deadcode
        run: deadcode ./...

  mutation-go:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MUTATION_PR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Prove mutation policy failures
        shell: pwsh
        run: ./scripts/Test-MutationPolicy.Unit.ps1

      - name: Mutate Go production code
        shell: pwsh
        run: ./scripts/Test-Mutations.ps1 -OutputDirectory mutation-artifacts

      - name: Retain complete Go mutation report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutation-go-${{ github.event.pull_request.head.sha || github.sha }}
          path: mutation-artifacts/go/
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  mutation-typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MUTATION_PR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            scripts/mutation-tools/package-lock.json

      - name: Mutate the TypeScript decision core
        shell: pwsh
        run: ./scripts/Test-TypeScriptMutations.ps1 -OutputDirectory mutation-artifacts

      - name: Retain complete TypeScript mutation report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutation-typescript-${{ github.event.pull_request.head.sha || github.sha }}
          path: mutation-artifacts/typescript/
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  mutation:
    needs:
      - mutation-go
      - mutation-typescript
    if: ${{ always() }}
    runs-on: ubuntu-latest

    steps:
      - name: Require every mutation target
        if: ${{ needs.mutation-go.result != 'success' || needs.mutation-typescript.result != 'success' }}
        shell: pwsh
        run: |
          throw "Required mutation failure: go=${{ needs.mutation-go.result }}, typescript=${{ needs.mutation-typescript.result }}."
