name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install pinned security scanners
        shell: pwsh
        run: ./scripts/Install-SecurityTools.ps1

      - name: Security scans
        shell: pwsh
        run: ./scripts/Test-Security.ps1

      - name: Prove controlled fixtures are rejected
        shell: pwsh
        run: ./scripts/Test-SecurityFixtures.ps1

  verify:
    needs: security
    if: ${{ always() }}
    runs-on: windows-latest

    steps:
      - name: Require security success
        if: needs.security.result != 'success'
        shell: pwsh
        run: throw "The required security job did not succeed."

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install analysis tools
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
          go install golang.org/x/tools/cmd/deadcode@v0.49.0

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Complexity
        shell: pwsh
        run: ./scripts/Test-Complexity.ps1

      - name: Staticcheck
        run: staticcheck ./...

      - name: Deadcode
        run: deadcode ./...

  mutation:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Mutation test
        shell: pwsh
        run: ./scripts/Test-Mutations.ps1
