name: Pi resource baseline collection

on:
  push:
    branches:
      - chore/issue-61-pi-retained-resources

permissions:
  contents: read

jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Collect three independent offline captures
        shell: pwsh
        run: |
          foreach ($capture in @('first', 'second', 'third')) {
            ./scripts/Test-PiResources.ps1 -RecordBaseline -OutputDirectory "$env:RUNNER_TEMP/pi-resource-baseline/$capture"
          }
      - name: Retain measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pi-resource-baseline-${{ matrix.os }}
          path: ${{ runner.temp }}/pi-resource-baseline
          if-no-files-found: warn
          overwrite: true
          retention-days: 14
