title: HemSoft TUI Launcher
shell: powershell.exe
shell_args:
  - -NoLogo
  - -Command
items:
  - name: Pi
    description: Open the Pi CLI
    model: select model
    reasoning_effort: default
    tags:
      - ai
      - pi
      - openai
      - cli
    choices:
      - name: GPT 6 Astra
        description: openai-codex/gpt-6-astra
        command: pi --model openai-codex/gpt-6-astra
      - name: GPT 5.6 Sol High
        description: openai-codex/gpt-5.6-sol at high reasoning
        command: pi --model openai-codex/gpt-5.6-sol --thinking high
      - name: GPT 5.6 Luna Max
        description: openai-codex/gpt-5.6-luna at max reasoning
        command: pi --model openai-codex/gpt-5.6-luna --thinking max
      - name: GLM-5.3-Flash (2x usage)
        description: opencode-go/glm-5.3-flash
        command: pi --model opencode-go/glm-5.3-flash
      - name: Kimi K3
        description: opencode-go/kimi-k3
        command: pi --model opencode-go/kimi-k3
      - name: Qwen 3.8 Max
        description: opencode-go/qwen3.8-max
        command: pi --model opencode-go/qwen3.8-max
      - name: DeepSeek V4 Flash
        description: opencode-go/deepseek-v4-flash
        command: pi --model opencode-go/deepseek-v4-flash
      - name: Muse Spark V1.3 Contributor
        description: opencode-go/muse-spark-1.3-contributor
        command: pi --model opencode-go/muse-spark-1.3-contributor
  - name: Codex
    description: Open the Codex CLI
    model: gpt-6-astra
    reasoning_effort: high
    tags:
      - ai
      - openai
      - cli
    choices:
      - name: Start fresh
        description: Open a new Codex CLI session
        command: codex --dangerously-bypass-approvals-and-sandbox -m gpt-6-astra -c 'service_tier="default"' -c 'model_reasoning_effort="high"'
      - name: Resume last
        description: Resume the last Codex CLI session
        command: codex resume --last --dangerously-bypass-approvals-and-sandbox -m gpt-6-astra -c 'service_tier="default"' -c 'model_reasoning_effort="high"'
      - name: Resume picker
        description: Choose a Codex CLI session to resume
        command: codex resume --dangerously-bypass-approvals-and-sandbox -m gpt-6-astra -c 'service_tier="default"' -c 'model_reasoning_effort="high"'
      - name: GPT 5.6 Sol High
        description: Start Codex with GPT-5.6 Sol at high reasoning
        command: codex --dangerously-bypass-approvals-and-sandbox -m gpt-5.6-sol -c 'service_tier="default"' -c 'model_reasoning_effort="high"'
      - name: GPT 5.6 Sol High/Fast
        description: Start Codex with GPT-5.6 Sol at high reasoning and fast service
        command: codex --dangerously-bypass-approvals-and-sandbox -m gpt-5.6-sol -c 'service_tier="fast"' -c 'model_reasoning_effort="high"'
      - name: GPT 5.6 Luna
        description: Start Codex with GPT-5.6 Luna at medium reasoning
        command: codex --dangerously-bypass-approvals-and-sandbox -m gpt-5.6-luna -c 'service_tier="default"' -c 'model_reasoning_effort="medium"'
      - name: GPT 5.6 Luna/Fast
        description: Start Codex with GPT-5.6 Luna at medium reasoning and fast service
        command: codex --dangerously-bypass-approvals-and-sandbox -m gpt-5.6-luna -c 'service_tier="fast"' -c 'model_reasoning_effort="medium"'
  - name: Antigravity
    description: Open the Antigravity CLI
    command: agy --dangerously-skip-permissions
    reasoning_effort: default
    tags:
      - ai
      - google
      - cli
  - name: GitHub Copilot
    description: Open GitHub Copilot CLI
    model: select model
    reasoning_effort: default
    tags:
      - ai
      - github
      - cli
    choices:
      - name: GPT-5.5
        description: Use GPT-5.5 with high reasoning effort
        command: copilot --allow-all --model gpt-5.5 --reasoning-effort high
      - name: GPT-5.6 Sol
        description: Use GPT-5.6 Sol with high reasoning effort
        command: copilot --allow-all --model gpt-5.6-sol --reasoning-effort high
      - name: Claude Opus 5
        description: Use Claude Opus 5 with xhigh reasoning effort
        command: copilot --allow-all --model claude-opus-5 --reasoning-effort xhigh
  - name: Moonshot AI
    description: Open Kimi K3 with Moonshot AI credits
    command: '& "$repoRoot\scripts\Start-Moonshot.ps1" kimi-k3'
    model: moonshot/kimi-k3
    reasoning_effort: default
    tags:
      - ai
      - moonshot
      - kimi
      - opencode
      - cli
  - name: OpenCode
    description: Open OpenCode
    model: select model
    reasoning_effort: default
    env:
      - 'OPENCODE_PERMISSION={"*":"allow"}'
    tags:
      - ai
      - opencode
      - cli
    choices:
      - name: GLM-5.3-Flash (2x usage)
        description: opencode-go/glm-5.3-flash
        command: '& "$repoRoot\scripts\Start-OpenCode.ps1" opencode-go glm-5.3-flash'
      - name: Kimi K3
        description: opencode-go/kimi-k3
        command: '& "$repoRoot\scripts\Start-OpenCode.ps1" opencode-go kimi-k3'
      - name: Qwen 3.8 Max
        description: opencode-go/qwen3.8-max
        command: '& "$repoRoot\scripts\Start-OpenCode.ps1" opencode-go qwen3.8-max'
      - name: DeepSeek V4 Flash
        description: opencode-go/deepseek-v4-flash
        command: '& "$repoRoot\scripts\Start-OpenCode.ps1" opencode-go deepseek-v4-flash'
      - name: Muse Spark V1.3 Contributor
        description: opencode-go/muse-spark-1.3-contributor
        command: '& "$repoRoot\scripts\Start-OpenCode.ps1" opencode-go muse-spark-1.3-contributor'
      - name: Qwen 3.8 27B (home Ollama)
        description: ollama/qwen3.8:27b
        command: '& "$repoRoot\scripts\Start-Ollama.ps1" qwen3.8:27b'
      - name: Qwen 3.8 27B (amd Ollama)
        description: amd-ollama/qwen3.8:27b
        command: '& "$repoRoot\scripts\Start-AmdOllama.ps1" qwen3.8:27b'
  - name: OpenRouter
    description: Open OpenRouter models and image generation
    model: select model
    reasoning_effort: default
    env:
      - 'OPENCODE_PERMISSION={"*":"allow"}'
    tags:
      - ai
      - openrouter
      - opencode
      - cli
    choices:
      - name: Kimi K3 ($3/$15)
        description: openrouter/moonshotai/kimi-k3
        command: '& "$repoRoot\scripts\Start-OpenCode.ps1" openrouter moonshotai/kimi-k3'
      - name: Qwen 3.8 Max ($2/$6)
        description: openrouter/qwen/qwen3.8-max
        command: '& "$repoRoot\scripts\Start-OpenCode.ps1" openrouter qwen/qwen3.8-max'
      - name: GLM-5.3-Flash ($0.075/$0.25)
        description: openrouter/z-ai/glm-5.3-flash
        command: '& "$repoRoot\scripts\Start-OpenCode.ps1" openrouter z-ai/glm-5.3-flash'
      - name: Fusion (variable/variable)
        description: openrouter/openrouter/fusion
        command: '& "$repoRoot\scripts\Start-OpenCode.ps1" openrouter openrouter/fusion'
      - name: DeepSeek V4 Flash 0731 ($0.08/$0.18)
        description: openrouter/deepseek/deepseek-v4-flash-0731
        command: '& "$repoRoot\scripts\Start-OpenCode.ps1" openrouter deepseek/deepseek-v4-flash-0731'
      - name: Muse Spark V1.3 ($1.25/$4.25)
        description: openrouter/meta/muse-spark-1.3
        command: '& "$repoRoot\scripts\Start-OpenCode.ps1" openrouter meta/muse-spark-1.3'
      - name: Muse Spark V1.2 ($1.25/$4.25)
        description: openrouter/meta/muse-spark-1.2
        command: '& "$repoRoot\scripts\Start-OpenCode.ps1" openrouter meta/muse-spark-1.2'
      - name: Seedream 5.0 Pro ($0.045 1K/$0.09 2K)
        description: images/bytedance-seed/seedream-5-0-pro
        command: '& "$repoRoot\scripts\Start-OpenRouterImage.ps1"'
  - name: Ollama
    description: Open local Ollama models with OpenCode
    model: select model
    reasoning_effort: default
    tags:
      - ai
      - ollama
      - opencode
      - local
      - cli
    choices:
      - name: Qwen 3.8 27B
        description: ollama/qwen3.8:27b
        command: '& "$repoRoot\scripts\Start-Ollama.ps1" qwen3.8:27b'
  - name: Cursor
    description: Open the Cursor Agent CLI
    command: cursor-agent --disable-auto-update
    model: claude-opus-4.8
    reasoning_effort: xhigh
    tags:
      - ai
      - editor
      - cli
  - name: Claude Code
    description: Open Claude Code CLI
    command: claude --dangerously-skip-permissions
    model: claude-opus-4.8
    reasoning_effort: default
    tags:
      - ai
      - anthropic
      - cli
