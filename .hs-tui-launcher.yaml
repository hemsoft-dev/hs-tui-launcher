title: HemSoft TUI Launcher
shell: powershell.exe
shell_args:
  - -NoLogo
  - -Command
items:
  - name: Codex
    description: Open the Codex CLI
    model: gpt-5.6-sol
    reasoning_effort: high
    tags:
      - ai
      - openai
      - cli
    choices:
      - name: Start fresh
        description: Open a new Codex CLI session
        command: codex --dangerously-bypass-approvals-and-sandbox -m gpt-5.6-sol -c 'service_tier="default"' -c 'model_reasoning_effort="high"'
      - name: Resume last
        description: Resume the last Codex CLI session
        command: codex resume --last --dangerously-bypass-approvals-and-sandbox -m gpt-5.6-sol -c 'service_tier="default"' -c 'model_reasoning_effort="high"'
      - name: Resume picker
        description: Choose a Codex CLI session to resume
        command: codex resume --dangerously-bypass-approvals-and-sandbox -m gpt-5.6-sol -c 'service_tier="default"' -c 'model_reasoning_effort="high"'
  - name: GitHub Copilot
    description: Open GitHub Copilot CLI
    model: select model
    reasoning_effort: default
    tags:
      - ai
      - github
      - cli
    choices:
      - name: GPT-5.5
        description: Use GPT-5.5 with high reasoning effort
        command: copilot --allow-all --model gpt-5.5 --reasoning-effort high
      - name: GPT-5.6 Sol
        description: Use GPT-5.6 Sol with high reasoning effort
        command: copilot --allow-all --model gpt-5.6-sol --reasoning-effort high
      - name: Claude Opus 5
        description: Use Claude Opus 5 with xhigh reasoning effort
        command: copilot --allow-all --model claude-opus-5 --reasoning-effort xhigh
  - name: Cursor
    description: Open the Cursor Agent CLI
    command: cursor-agent --disable-auto-update
    model: claude-opus-4.8
    reasoning_effort: xhigh
    tags:
      - ai
      - editor
      - cli
  - name: Claude Code
    description: Open Claude Code CLI
    command: claude --dangerously-skip-permissions
    model: claude-opus-4.8
    reasoning_effort: default
    tags:
      - ai
      - anthropic
      - cli
  - name: OpenCode
    description: Open OpenCode
    model: select model
    reasoning_effort: default
    env:
      - 'OPENCODE_PERMISSION={"*":"allow"}'
    tags:
      - ai
      - opencode
      - cli
    choices:
      - name: Kimi K3
        description: opencode-go/kimi-k3
        command: '& "$repoRoot\scripts\Start-OpenCode.ps1" opencode-go kimi-k3'
      - name: Kimi K2.7 Code
        description: opencode-go/kimi-k2.7-code
        command: '& "$repoRoot\scripts\Start-OpenCode.ps1" opencode-go kimi-k2.7-code'
  - name: OpenRouter
    description: Open OpenCode with OpenRouter
    model: select model
    reasoning_effort: default
    env:
      - 'OPENCODE_PERMISSION={"*":"allow"}'
    tags:
      - ai
      - openrouter
      - opencode
      - cli
    choices:
      - name: Kimi K3 ($3/$15 per 1M)
        description: openrouter/moonshotai/kimi-k3
        command: '& "$repoRoot\scripts\Start-OpenCode.ps1" openrouter moonshotai/kimi-k3'
      - name: Qwen 3.8 Max ($2/$6 per 1M)
        description: openrouter/qwen/qwen3.8-max
        command: '& "$repoRoot\scripts\Start-OpenCode.ps1" openrouter qwen/qwen3.8-max'
      - name: GLM 5.2 ($0.76/$2.42 per 1M)
        description: openrouter/z-ai/glm-5.2
        command: '& "$repoRoot\scripts\Start-OpenCode.ps1" openrouter z-ai/glm-5.2'
      - name: Fusion (variable/variable)
        description: openrouter/openrouter/fusion
        command: '& "$repoRoot\scripts\Start-OpenCode.ps1" openrouter openrouter/fusion'
