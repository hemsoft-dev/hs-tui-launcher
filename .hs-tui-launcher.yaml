title: HemSoft TUI Launcher
shell: powershell.exe
shell_args:
  - -NoLogo
  - -Command
items:
  - name: Codex
    description: Open the Codex CLI
    command: codex -c 'service_tier="default"' -c 'model_reasoning_effort="high"'
    model: gpt-5.5
    reasoning_effort: high
    tags:
      - ai
      - openai
      - cli
  - name: GitHub Copilot
    description: Open GitHub Copilot CLI
    command: gh copilot
    model: claude-opus-4.8
    reasoning_effort: default
    tags:
      - ai
      - github
      - cli
  - name: Cursor
    description: Open the Cursor Agent CLI
    command: cursor-agent
    model: claude-opus-4-8
    reasoning_effort: xhigh
    tags:
      - ai
      - editor
      - cli
  - name: Claude Code
    description: Open Claude Code CLI
    command: claude --dangerously-skip-permissions
    model: claude-opus-4.8
    reasoning_effort: default
    tags:
      - ai
      - anthropic
      - cli
  - name: OpenCode MiniMax M3 Free
    description: Open OpenCode with MiniMax M3 Free
    command: opencode --model opencode/minimax-m3-free
    model: opencode/minimax-m3-free
    reasoning_effort: default
    tags:
      - ai
      - opencode
      - cli
