title: HemSoft TUI Launcher
shell: powershell.exe
shell_args:
  - -NoLogo
  - -Command
items:
  - name: Codex
    description: Open the Codex CLI
    model: gpt-5.5
    reasoning_effort: high
    tags:
      - ai
      - openai
      - cli
    choices:
      - name: Start fresh
        description: Open a new Codex CLI session
        command: codex --dangerously-bypass-approvals-and-sandbox -m gpt-5.5 -c 'service_tier="default"' -c 'model_reasoning_effort="high"'
      - name: Resume last
        description: Resume the last Codex CLI session
        command: codex resume --last --dangerously-bypass-approvals-and-sandbox -m gpt-5.5 -c 'service_tier="default"' -c 'model_reasoning_effort="high"'
      - name: Resume picker
        description: Choose a Codex CLI session to resume
        command: codex resume --dangerously-bypass-approvals-and-sandbox -m gpt-5.5 -c 'service_tier="default"' -c 'model_reasoning_effort="high"'
  - name: GitHub Copilot
    description: Open GitHub Copilot CLI
    command: copilot --allow-all
    model: gpt-5.5
    reasoning_effort: high
    tags:
      - ai
      - github
      - cli
  - name: Cursor
    description: Open the Cursor Agent CLI
    command: cursor-agent
    model: claude-opus-4-8
    reasoning_effort: xhigh
    tags:
      - ai
      - editor
      - cli
  - name: Claude Code
    description: Open Claude Code CLI
    command: claude --dangerously-skip-permissions
    model: claude-opus-4.8
    reasoning_effort: default
    tags:
      - ai
      - anthropic
      - cli
  - name: OpenCode Kimi K2.7 Code
    description: Open OpenCode with Kimi K2.7 Code
    command: opencode --model opencode-go/kimi-k2.7-code
    model: opencode-go/kimi-k2.7-code
    reasoning_effort: default
    env:
      - 'OPENCODE_PERMISSION={"*":"allow"}'
    tags:
      - ai
      - opencode
      - cli
